name: vericlaim-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the model artifact required by the model tests
        run: git lfs pull --include="models/vericlaim_model.joblib" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
