[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vericlaim-ai"
version = "1.0.0"
description = "Explainable vehicle-claim fraud triage"
requires-python = ">=3.11"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.3.5",
  "Pillow==12.2.0",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

